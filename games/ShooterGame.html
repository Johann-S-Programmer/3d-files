<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Shooter Game</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #080b12;
        font-family: Arial, Helvetica, sans-serif;
        user-select: none;
    }

    #gameCanvas {
        display: block;
        width: 100%;
        height: 100vh;
        cursor: crosshair;
    }

    /* =========================
       HUD
    ========================= */

    #hud-top {
        position: absolute;
        top: 20px;
        left: 20px;
        display: flex;
        align-items: center;
        gap: 25px;
        pointer-events: none;
        z-index: 10;
    }

    #score {
        color: white;
        font-size: 24px;
        font-weight: bold;
        text-shadow:
            2px 2px 4px black,
            0 0 8px rgba(255,255,255,0.25);
        white-space: nowrap;
    }

    #feedback {
        color: #ffff00;
        font-size: 20px;
        font-weight: bold;
        text-shadow: 2px 2px 4px black;
        min-width: 100px;
    }

    #instructions-container {
        position: absolute;
        top: 62px;
        left: 20px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        pointer-events: none;
        z-index: 10;
    }

    #instructions {
        color: white;
        font-size: 15px;
        text-shadow: 2px 2px 4px black;
    }

    #powerup {
        color: #00ffff;
        font-size: 18px;
        font-weight: bold;
        text-shadow:
            2px 2px 4px black,
            0 0 10px #00ffff;
        min-height: 22px;
    }

    /* =========================
       CROSSHAIR
    ========================= */

    #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 34px;
        height: 34px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 5;
    }

    #crosshair::before,
    #crosshair::after {
        content: "";
        position: absolute;
        background: rgba(255,255,255,0.9);
        box-shadow: 0 0 4px black;
    }

    #crosshair::before {
        width: 34px;
        height: 2px;
        left: 0;
        top: 16px;
    }

    #crosshair::after {
        width: 2px;
        height: 34px;
        left: 16px;
        top: 0;
    }

    .crosshair-dot {
        position: absolute;
        width: 4px;
        height: 4px;
        background: #ff3333;
        border-radius: 50%;
        left: 15px;
        top: 15px;
        box-shadow: 0 0 6px #ff3333;
    }

    /* =========================
       MENUS
    ========================= */

    #gameOver,
    #pauseMenu {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 48px;
        font-weight: bold;
        text-shadow: 3px 3px 8px black;
        display: none;
        text-align: center;
        z-index: 20;
        padding: 35px;
        min-width: 350px;
        background: rgba(0,0,0,0.65);
        border: 2px solid rgba(255,255,255,0.25);
        border-radius: 16px;
        backdrop-filter: blur(5px);
    }

    #finalScore {
        margin-top: 15px;
        font-size: 24px;
        font-weight: normal;
    }

    .menu-button {
        font-size: 22px;
        font-weight: bold;
        padding: 14px 28px;
        margin-top: 25px;
        cursor: pointer;
        color: white;
        border: none;
        border-radius: 10px;
        transition:
            transform 0.15s ease,
            filter 0.15s ease;
    }

    .menu-button:hover {
        transform: scale(1.05);
        filter: brightness(1.2);
    }

    #restartBtn {
        background: #e53935;
    }

    #resumeBtn {
        background: #27ae60;
    }

    /* =========================
       POWER-UP FLASH
    ========================= */

    #powerupFlash {
        position: fixed;
        inset: 0;
        background: rgba(0,255,255,0.12);
        pointer-events: none;
        opacity: 0;
        z-index: 4;
    }

    #powerupFlash.active {
        animation: powerFlash 0.5s ease-out;
    }

    @keyframes powerFlash {
        0% {
            opacity: 0;
        }

        30% {
            opacity: 1;
        }

        100% {
            opacity: 0;
        }
    }

    @media (max-width: 600px) {
        #hud-top {
            top: 12px;
            left: 12px;
            gap: 12px;
        }

        #score {
            font-size: 18px;
        }

        #feedback {
            font-size: 16px;
        }

        #instructions-container {
            top: 45px;
            left: 12px;
        }

        #instructions {
            font-size: 12px;
        }

        #gameOver,
        #pauseMenu {
            min-width: 280px;
            font-size: 36px;
            padding: 25px;
        }
    }
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<div id="hud-top">
    <div id="score">Score: 0 | Lives: 10</div>
    <div id="feedback"></div>
</div>

<div id="instructions-container">
    <div id="instructions">
        SPACE / CLICK to shoot • ESC to pause • SHIFT for slow motion
    </div>

    <div id="powerup"></div>
</div>

<div id="crosshair">
    <div class="crosshair-dot"></div>
</div>

<div id="powerupFlash"></div>

<div id="gameOver">
    <div>GAME OVER</div>
    <div id="finalScore"></div>
    <button id="restartBtn" class="menu-button">
        RESTART
    </button>
</div>

<div id="pauseMenu">
    <div>PAUSED</div>
    <button id="resumeBtn" class="menu-button">
        RESUME (ESC)
    </button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
"use strict";

/* =========================================================
   SETUP
========================================================= */

const canvas = document.getElementById("gameCanvas");

const scene = new THREE.Scene();

/* Gradient-like sky */
scene.background = new THREE.Color(0x101827);

scene.fog = new THREE.Fog(
    0x101827,
    25,
    80
);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

camera.position.set(
    0,
    2,
    5
);

camera.lookAt(
    0,
    1,
    -10
);

scene.add(camera);


/* =========================================================
   LIGHTING
========================================================= */

const directionalLight = new THREE.DirectionalLight(
    0xffffff,
    1.2
);

directionalLight.position.set(
    10,
    20,
    10
);

directionalLight.castShadow = true;

directionalLight.shadow.mapSize.width = 2048;
directionalLight.shadow.mapSize.height = 2048;

scene.add(directionalLight);


const ambientLight = new THREE.AmbientLight(
    0xffffff,
    0.45
);

scene.add(ambientLight);


/* =========================================================
   GROUND
========================================================= */

const groundGeometry =
    new THREE.PlaneGeometry(
        100,
        100
    );

const groundMaterial =
    new THREE.MeshLambertMaterial({
        color: 0x252a32
    });

const ground =
    new THREE.Mesh(
        groundGeometry,
        groundMaterial
    );

ground.rotation.x =
    -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


/* =========================================================
   GROUND GRID
========================================================= */

const gridHelper =
    new THREE.GridHelper(
        100,
        50,
        0x555555,
        0x303030
    );

gridHelper.position.y = 0.01;

scene.add(gridHelper);


/* =========================================================
   YELLOW TARGET RING
========================================================= */

const TARGET_DISTANCE = 10;

const ringGeometry =
    new THREE.RingGeometry(
        9.5,
        10.5,
        96
    );

const ringMaterial =
    new THREE.MeshBasicMaterial({
        color: 0xffff00,
        side: THREE.DoubleSide
    });

const boundaryLine =
    new THREE.Mesh(
        ringGeometry,
        ringMaterial
    );

boundaryLine.rotation.x =
    -Math.PI / 2;

boundaryLine.position.y = 0.05;

scene.add(boundaryLine);


/* =========================================================
   GUN
========================================================= */

const gunGroup =
    new THREE.Group();

const barrelGeometry =
    new THREE.BoxGeometry(
        0.12,
        0.12,
        0.9
    );

const barrelMaterial =
    new THREE.MeshLambertMaterial({
        color: 0x333333
    });

const barrel =
    new THREE.Mesh(
        barrelGeometry,
        barrelMaterial
    );

barrel.position.z = -0.45;

barrel.castShadow = true;


const handleGeometry =
    new THREE.BoxGeometry(
        0.14,
        0.35,
        0.22
    );

const handleMaterial =
    new THREE.MeshLambertMaterial({
        color: 0x555555
    });

const handle =
    new THREE.Mesh(
        handleGeometry,
        handleMaterial
    );

handle.position.y = -0.18;
handle.position.z = 0.05;

handle.castShadow = true;


const muzzleGeometry =
    new THREE.CylinderGeometry(
        0.08,
        0.08,
        0.15,
        12
    );

const muzzleMaterial =
    new THREE.MeshBasicMaterial({
        color: 0x111111
    });

const muzzle =
    new THREE.Mesh(
        muzzleGeometry,
        muzzleMaterial
    );

muzzle.rotation.x =
    Math.PI / 2;

muzzle.position.z = -0.91;


gunGroup.add(
    barrel,
    handle,
    muzzle
);

gunGroup.position.set(
    0.35,
    -0.35,
    -1
);

camera.add(gunGroup);


/* =========================================================
   GAME VARIABLES
========================================================= */

let score = 0;
let maxScore = 0;

let lives = 10;

let enemies = [];
let bullets = [];
let particles = [];

let gameRunning = true;
let gamePaused = false;

let spawnTimer = null;

let enemySpeed = 3.0;
let spawnInterval = 2.0;

let enemiesDefeated = 0;

const KILLS_REQUIRED = 15;

let isSlowMo = false;
let slowMoTimeout = null;

let recoilAmount = 0;
let screenShake = 0;

let lastTime = performance.now();


/* =========================================================
   HUD ELEMENTS
========================================================= */

const scoreDisplay =
    document.getElementById("score");

const feedbackDisplay =
    document.getElementById("feedback");

const powerupDisplay =
    document.getElementById("powerup");

const powerupFlash =
    document.getElementById("powerupFlash");

const gameOverMenu =
    document.getElementById("gameOver");

const pauseMenu =
    document.getElementById("pauseMenu");

const finalScore =
    document.getElementById("finalScore");


/* =========================================================
   UPDATE HUD
========================================================= */

function updateHUD() {

    scoreDisplay.textContent =
        `Score: ${score} | Lives: ${lives}`;
}


/* =========================================================
   FEEDBACK
========================================================= */

let feedbackTimeout = null;

function showFeedback(
    message,
    color = "#ffff00"
) {

    feedbackDisplay.textContent =
        message;

    feedbackDisplay.style.color =
        color;

    clearTimeout(feedbackTimeout);

    feedbackTimeout =
        setTimeout(() => {

            feedbackDisplay.textContent =
                "";

            feedbackDisplay.style.color =
                "#ffff00";

        }, 1000);
}


/* =========================================================
   ENEMY CREATION
========================================================= */

const enemyGeometry =
    new THREE.SphereGeometry(
        0.55,
        20,
        20
    );

const enemyColors = [
    0xff3333,
    0xff7b00,
    0xff00ff,
    0x9933ff,
    0x00ccff
];


function createEnemy() {

    if (!gameRunning || gamePaused)
        return;

    const color =
        enemyColors[
            Math.floor(
                Math.random() *
                enemyColors.length
            )
        ];

    const material =
        new THREE.MeshLambertMaterial({
            color: color,
            emissive: color,
            emissiveIntensity: 0.12
        });

    const enemy =
        new THREE.Mesh(
            enemyGeometry,
            material
        );

    /*
        Spawn in a cone in front
        of the player.
    */

    const coneAngle =
        THREE.MathUtils.degToRad(35);

    const randomAngle =
        (Math.random() - 0.5) *
        coneAngle;

    const distance = 32;

    const x =
        Math.sin(randomAngle) *
        distance;

    const z =
        -Math.cos(randomAngle) *
        distance;

    enemy.position.set(
        x,
        0.55,
        z
    );

    enemy.castShadow = true;

    enemy.userData = {
        alive: true,
        radius: 0.55,
        wobble: Math.random() * Math.PI * 2,
        health: 1
    };

    scene.add(enemy);

    enemies.push(enemy);
}


/* =========================================================
   SPAWNING
========================================================= */

function calculateDifficulty() {

    const difficulty =
        Math.floor(score / 50);

    spawnInterval =
        Math.max(
            0.35,
            2.0 - difficulty * 0.12
        );

    enemySpeed =
        3.0 + difficulty * 0.35;
}


function startSpawning() {

    stopSpawning();

    calculateDifficulty();

    spawnTimer =
        setInterval(() => {

            if (
                gameRunning &&
                !gamePaused
            ) {
                createEnemy();
                calculateDifficulty();
            }

        }, spawnInterval * 1000);
}


function stopSpawning() {

    if (spawnTimer !== null) {

        clearInterval(spawnTimer);

        spawnTimer = null;
    }
}


/* =========================================================
   BULLET
========================================================= */

function createBullet(target) {

    const geometry =
        new THREE.SphereGeometry(
            0.09,
            8,
            8
        );

    const material =
        new THREE.MeshBasicMaterial({
            color: 0xffffff
        });

    const bullet =
        new THREE.Mesh(
            geometry,
            material
        );

    const start =
        new THREE.Vector3();

    camera.getWorldPosition(start);

    bullet.position.copy(start);

    const direction =
        new THREE.Vector3();

    direction
        .subVectors(
            target.position,
            start
        )
        .normalize();

    bullet.userData = {
        velocity:
            direction.multiplyScalar(45),

        life: 0,

        target: target
    };

    scene.add(bullet);

    bullets.push(bullet);
}


/* =========================================================
   SHOOT
========================================================= */

let canShoot = true;


function shoot() {

    if (
        !canShoot ||
        !gameRunning ||
        gamePaused
    ) {
        return;
    }

    canShoot = false;

    /*
        Very short cooldown so holding
        the button doesn't destroy the
        entire game instantly.
    */

    setTimeout(() => {
        canShoot = true;
    }, 90);


    recoilGun();


    /*
        Find the closest enemy
        inside the player's view.
    */

    let closestEnemy = null;
    let closestDistance = Infinity;

    for (const enemy of enemies) {

        if (!enemy.userData.alive)
            continue;

        const distance =
            enemy.position.distanceTo(
                camera.position
            );

        if (
            distance <
            closestDistance
        ) {

            closestDistance =
                distance;

            closestEnemy =
                enemy;
        }
    }


    if (!closestEnemy) {

        showFeedback(
            "MISS",
            "#aaaaaa"
        );

        return;
    }


    createBullet(
        closestEnemy
    );
}


/* =========================================================
   GUN RECOIL
========================================================= */

function recoilGun() {

    recoilAmount = 0.18;

    screenShake = 0.035;
}


/* =========================================================
   HIT ENEMY
========================================================= */

function hitEnemy(
    enemy,
    distance
) {

    if (
        !enemy ||
        !enemy.userData.alive
    ) {
        return;
    }

    enemy.userData.alive = false;


    /*
        Score based on how close
        the enemy is to the yellow ring.
    */

    const distanceFromTarget =
        Math.abs(
            distance -
            TARGET_DISTANCE
        );

    let points =
        Math.max(
            1,
            Math.round(
                30 -
                distanceFromTarget * 3
            )
        );


    let message;


    if (
        distanceFromTarget <
        0.3
    ) {

        message =
            `PERFECT! +${points}`;

    } else if (
        distanceFromTarget <
        1
    ) {

        message =
            `GREAT! +${points}`;

    } else if (
        distanceFromTarget <
        2
    ) {

        message =
            `GOOD! +${points}`;

    } else {

        message =
            `HIT! +${points}`;
    }


    score += points;

    if (score > maxScore)
        maxScore = score;


    enemiesDefeated++;


    createExplosion(
        enemy.position,
        enemy.material.color
    );


    removeEnemy(enemy);


    showFeedback(
        message,
        "#ffff00"
    );


    updateHUD();


    /*
        Activate power-up after
        enough kills.
    */

    if (
        enemiesDefeated >=
        KILLS_REQUIRED
    ) {

        enemiesDefeated = 0;

        activatePowerUp();
    }
}


/* =========================================================
   REMOVE ENEMY
========================================================= */

function removeEnemy(enemy) {

    const index =
        enemies.indexOf(enemy);

    if (index !== -1)
        enemies.splice(index, 1);

    scene.remove(enemy);

    /*
        Material is unique per enemy,
        so it can be disposed safely.
    */

    if (enemy.material)
        enemy.material.dispose();
}


/* =========================================================
   EXPLOSION PARTICLES
========================================================= */

function createExplosion(
    position,
    color
) {

    const particleGeometry =
        new THREE.SphereGeometry(
            0.055,
            6,
            6
        );

    for (
        let i = 0;
        i < 14;
        i++
    ) {

        const material =
            new THREE.MeshBasicMaterial({
                color: color
            });

        const particle =
            new THREE.Mesh(
                particleGeometry,
                material
            );

        particle.position.copy(
            position
        );

        const velocity =
            new THREE.Vector3(
                (Math.random() - 0.5) * 8,
                (Math.random() - 0.2) * 8,
                (Math.random() - 0.5) * 8
            );

        particle.userData = {
            velocity: velocity,
            life: 0
        };

        scene.add(particle);

        particles.push(
            particle
        );
    }
}


/* =========================================================
   UPDATE BULLETS
========================================================= */

function updateBullets(delta) {

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        const bullet =
            bullets[i];

        bullet.position.addScaledVector(
            bullet.userData.velocity,
            delta
        );

        bullet.userData.life +=
            delta;


        /*
            Bullet collision
        */

        let hit = false;

        for (
            let j = enemies.length - 1;
            j >= 0;
            j--
        ) {

            const enemy =
                enemies[j];

            if (
                !enemy.userData.alive
            )
                continue;

            const distance =
                bullet.position.distanceTo(
                    enemy.position
                );

            if (
                distance <
                0.7
            ) {

                const enemyDistance =
                    enemy.position.distanceTo(
                        camera.position
                    );

                hitEnemy(
                    enemy,
                    enemyDistance
                );

                hit = true;

                break;
            }
        }


        /*
            Remove old bullets.
        */

        if (
            hit ||
            bullet.userData.life >
                1.5 ||
            bullet.position.distanceTo(
                camera.position
            ) > 60
        ) {

            scene.remove(bullet);

            bullet.geometry.dispose();
            bullet.material.dispose();

            bullets.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   UPDATE PARTICLES
========================================================= */

function updateParticles(delta) {

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const particle =
            particles[i];

        particle.userData.life +=
            delta;

        particle.position.addScaledVector(
            particle.userData.velocity,
            delta
        );

        particle.userData.velocity.y -=
            10 * delta;

        particle.scale.multiplyScalar(
            0.96
        );


        if (
            particle.userData.life >
            0.7
        ) {

            scene.remove(
                particle
            );

            particle.material.dispose();

            particles.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   UPDATE ENEMIES
========================================================= */

function updateEnemies(delta) {

    /*
        Work backwards so removing
        enemies is safe.
    */

    for (
        let i = enemies.length - 1;
        i >= 0;
        i--
    ) {

        const enemy =
            enemies[i];

        if (
            !enemy.userData.alive
        )
            continue;


        const direction =
            new THREE.Vector3();

        direction
            .subVectors(
                camera.position,
                enemy.position
            )
            .normalize();


        const currentSpeed =
            isSlowMo
                ? enemySpeed * 0.2
                : enemySpeed;


        enemy.position.addScaledVector(
            direction,
            currentSpeed * delta
        );


        /*
            Slight floating motion
            makes enemies feel less static.
        */

        enemy.userData.wobble +=
            delta * 3;

        enemy.position.y =
            0.55 +
            Math.sin(
                enemy.userData.wobble
            ) * 0.15;


        enemy.rotation.x +=
            delta * 1.5;

        enemy.rotation.y +=
            delta * 2;


        /*
            Enemy reaches player.
        */

        const distance =
            enemy.position.distanceTo(
                camera.position
            );


        if (
            distance < 2
        ) {

            removeEnemy(enemy);

            lives--;

            updateHUD();

            showFeedback(
                "YOU'RE HIT! -1 LIFE",
                "#ff3333"
            );

            screenShake = 0.15;


            if (
                lives <= 0
            ) {

                endGame();

                return;
            }
        }
    }
}


/* =========================================================
   POWER-UP
========================================================= */

function activatePowerUp() {

    isSlowMo = true;

    powerupDisplay.textContent =
        "⚡ POWER UP: TIME SLOWED! ⚡";

    powerupFlash.classList.remove(
        "active"
    );

    /*
        Force animation restart.
    */

    void powerupFlash.offsetWidth;

    powerupFlash.classList.add(
        "active"
    );


    clearTimeout(
        slowMoTimeout
    );


    slowMoTimeout =
        setTimeout(() => {

            isSlowMo = false;

            powerupDisplay.textContent =
                "";

        }, 5000);
}


/* =========================================================
   PAUSE
========================================================= */

function togglePause() {

    if (!gameRunning)
        return;

    gamePaused =
        !gamePaused;


    if (gamePaused) {

        pauseMenu.style.display =
            "block";

    } else {

        pauseMenu.style.display =
            "none";
    }
}


/* =========================================================
   GAME OVER
========================================================= */

function endGame() {

    gameRunning = false;

    stopSpawning();

    gamePaused = false;

    finalScore.textContent =
        `Final Score: ${score}`;

    gameOverMenu.style.display =
        "block";
}


/* =========================================================
   RESTART
========================================================= */

document
    .getElementById("restartBtn")
    .addEventListener(
        "click",
        () => {

            location.reload();
        }
    );


/* =========================================================
   RESUME
========================================================= */

document
    .getElementById("resumeBtn")
    .addEventListener(
        "click",
        togglePause
    );


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();

            shoot();
        }


        if (
            event.code ===
            "Escape"
        ) {

            event.preventDefault();

            togglePause();
        }


        if (
            event.code ===
            "ShiftLeft"
        ) {

            isSlowMo =
                !isSlowMo;

            showFeedback(
                isSlowMo
                    ? "TIME SLOWED"
                    : "TIME NORMAL",
                isSlowMo
                    ? "#00ffff"
                    : "#ffff00"
            );
        }
    }
);


/* =========================================================
   MOUSE / TOUCH
========================================================= */

canvas.addEventListener(
    "pointerdown",
    event => {

        if (
            event.pointerType ===
            "mouse" ||
            event.pointerType ===
            "touch"
        ) {

            shoot();
        }
    }
);


/* =========================================================
   GUN AIMING
========================================================= */

function updateGun(delta) {

    let closestEnemy = null;

    let closestDistance =
        Infinity;


    for (
        const enemy of enemies
    ) {

        if (
            !enemy.userData.alive
        )
            continue;


        const distance =
            enemy.position.distanceTo(
                camera.position
            );


        if (
            distance <
            closestDistance
        ) {

            closestDistance =
                distance;

            closestEnemy =
                enemy;
        }
    }


    if (closestEnemy) {

        const worldPosition =
            new THREE.Vector3();

        camera.getWorldPosition(
            worldPosition
        );


        const direction =
            new THREE.Vector3()
                .subVectors(
                    closestEnemy.position,
                    worldPosition
                )
                .normalize();


        /*
            Quaternion makes the gun
            actually point toward the target.
        */

        const targetQuaternion =
            new THREE.Quaternion();

        targetQuaternion.setFromUnitVectors(
            new THREE.Vector3(
                0,
                0,
                -1
            ),
            direction
        );


        gunGroup.quaternion.slerp(
            targetQuaternion,
            Math.min(
                1,
                delta * 12
            )
        );
    }


    /*
        Recoil smoothly returns.
    */

    if (recoilAmount > 0) {

        recoilAmount *=
            Math.pow(
                0.001,
                delta
            );

        if (
            recoilAmount < 0.001
        ) {

            recoilAmount = 0;
        }
    }


    gunGroup.position.z =
        -1 +
        recoilAmount;
}


/* =========================================================
   CAMERA SHAKE
========================================================= */

function updateCameraShake(delta) {

    if (screenShake > 0) {

        camera.position.x =
            Math.sin(
                performance.now() * 0.05
            ) * screenShake;

        camera.position.y =
            2 +
            Math.cos(
                performance.now() * 0.06
            ) * screenShake;


        screenShake *=
            Math.pow(
                0.001,
                delta
            );

    } else {

        camera.position.x = 0;
        camera.position.y = 2;
    }
}


/* =========================================================
   ANIMATION LOOP
========================================================= */

function animate(now) {

    requestAnimationFrame(
        animate
    );


    let delta =
        (now - lastTime) / 1000;

    lastTime = now;


    /*
        Prevent giant jumps if the
        browser tab was inactive.
    */

    delta =
        Math.min(
            delta,
            0.05
        );


    if (
        !gameRunning ||
        gamePaused
    ) {

        renderer.render(
            scene,
            camera
        );

        return;
    }


    updateBullets(
        delta
    );

    updateParticles(
        delta
    );

    updateEnemies(
        delta
    );

    updateGun(
        delta
    );

    updateCameraShake(
        delta
    );


    /*
        Slowly rotate the target ring.
    */

    boundaryLine.rotation.z +=
        delta * 0.15;


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   WINDOW RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                2
            )
        );
    }
);


/* =========================================================
   START
========================================================= */

updateHUD();

startSpawning();

requestAnimationFrame(
    animate
);

</script>

</body>
